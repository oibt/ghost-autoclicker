name: Test build

# Builds GhostAutoClicker.exe from a branch without publishing a release.
# Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test (open the app on Windows, then close it)
        run: >
          python -c "import tkinter, autoclicker;
          root = tkinter.Tk(); app = autoclicker.App(root);
          root.after(3000, root.destroy); root.mainloop(); print('UI started OK')"
      - name: Build exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --onefile --noconsole --name GhostAutoClicker --icon assets/ghost.ico autoclicker.py
      - name: Check the exe icon
        run: python .github/scripts/check_exe_icon.py dist/GhostAutoClicker.exe assets/ghost.ico
      - uses: actions/upload-artifact@v4
        with:
          name: GhostAutoClicker-test-build
          path: dist/GhostAutoClicker.exe
